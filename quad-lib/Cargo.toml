[package]
name = "quad-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
log = "0.4.27"
macroquad = "0.4.14"
nanoserde = "0.2.1"

[target.wasm32-unknown-unknown.dependencies]
